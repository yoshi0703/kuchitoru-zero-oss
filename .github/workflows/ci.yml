name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  DO_NOT_TRACK: "1"
  SUPABASE_TELEMETRY_DISABLED: "1"
  VITE_APP_ORIGIN: http://127.0.0.1:4173
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
  VITE_SUPABASE_URL: http://127.0.0.1:56321
  VITE_TURNSTILE_SITE_KEY: turnstile_ci_fixture

jobs:
  quality:
    name: Quality and DCO
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for commit in $(git rev-list "$BASE_SHA..HEAD"); do
            git show -s --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <.+>$' || {
              echo "::error::Missing Signed-off-by in $commit"
              exit 1
            }
          done
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
          version: 10.34.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:community
      - run: pnpm verify:licenses
      - run: pnpm audit --audit-level high
      - run: pnpm check

  database-edge-e2e:
    name: Supabase, RLS, Edge, and browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
          version: 10.34.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:edge
      - run: pnpm lint:edge
      - run: pnpm typecheck:edge
      - run: pnpm test:edge
      - run: pnpm supabase:start
      - run: pnpm supabase:reset
      - name: Database schema and RLS tests
        run: pnpm test:db
      - run: pnpm exec playwright test --project=chromium
      - name: Local Supabase integration flow
        env:
          KUCHITORU_ALLOW_LOCAL_DB_RESET: "1"
        run: pnpm test:e2e:integration
      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: kuchitoru-zero-community:ci
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            VITE_APP_ORIGIN=http://127.0.0.1:3000
            VITE_SUPABASE_URL=http://127.0.0.1:8000
            VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kuchitoru-zero-community:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
